name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EDVO_VERSION_NAME: ${{ github.ref_name }}
      EDVO_VERSION_CODE: ${{ github.run_number }}
      EDVO_KEYSTORE_FILE: ${{ github.workspace }}/edvo-release.keystore
      EDVO_KEYSTORE_PASSWORD: ${{ secrets.EDVO_KEYSTORE_PASSWORD }}
      EDVO_KEY_ALIAS: ${{ secrets.EDVO_KEY_ALIAS }}
      EDVO_KEY_PASSWORD: ${{ secrets.EDVO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Sync web assets into Android
        run: |
          npm ci
          echo "window.EDVO_APP_VERSION = '${GITHUB_REF_NAME#v}';" > www/version.js
          npx cap sync android
      - name: Restore signing key
        run: echo "${{ secrets.EDVO_KEYSTORE_BASE64 }}" | base64 --decode > "$EDVO_KEYSTORE_FILE"
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Prepare release assets
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk edvo-bot.apk
          # Live-update bundle; the name carries the oldest APK version able to run it.
          WEB_BUNDLE="edvo-bot-web-min-native-$(tr -d '[:space:]' < native-version.txt).zip"
          (cd www && zip -qr "../$WEB_BUNDLE" .)
          echo "WEB_BUNDLE=$WEB_BUNDLE" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" edvo-bot.apk "$WEB_BUNDLE" --title "EDVO Bot $GITHUB_REF_NAME" --generate-notes
